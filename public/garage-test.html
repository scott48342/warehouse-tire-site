<!DOCTYPE html>
<html>
<head>
  <title>Garage Flow Test</title>
  <style>
    body { font-family: system-ui; padding: 20px; max-width: 800px; margin: 0 auto; }
    .pass { color: green; }
    .fail { color: red; }
    .result { margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 4px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
    #output { white-space: pre-wrap; font-family: monospace; }
    .step { margin: 15px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
    .step h3 { margin-top: 0; }
  </style>
</head>
<body>
  <h1>Garage URL → Garage Flow Test</h1>
  
  <div class="step">
    <h3>Test Flow</h3>
    <button onclick="runFullTest()">Run Full Test</button>
    <button onclick="clearAndRefresh()">Clear Storage & Refresh</button>
  </div>
  
  <div id="output"></div>

  <script>
    const log = (msg, isPass = null) => {
      const div = document.createElement('div');
      div.className = 'result ' + (isPass === true ? 'pass' : isPass === false ? 'fail' : '');
      div.textContent = (isPass === true ? '✅ ' : isPass === false ? '❌ ' : '📋 ') + msg;
      document.getElementById('output').appendChild(div);
    };

    const clearLog = () => {
      document.getElementById('output').innerHTML = '';
    };

    function getGarage() {
      try {
        const raw = localStorage.getItem('wt_garage');
        if (!raw) return { vehicles: [] };
        return JSON.parse(raw);
      } catch { return { vehicles: [] }; }
    }

    function getActiveId() {
      try {
        const raw = localStorage.getItem('wt_garage_active_id');
        if (!raw) return null;
        return JSON.parse(raw);
      } catch { return null; }
    }

    function getActiveVehicle() {
      const id = getActiveId();
      if (!id) return null;
      const garage = getGarage();
      return garage.vehicles.find(v => v.id === id) || null;
    }

    function clearAndRefresh() {
      localStorage.clear();
      location.reload();
    }

    async function runFullTest() {
      clearLog();
      log('Starting Garage URL Flow Test...');
      log('');

      // Check initial state
      const initialGarage = getGarage();
      const initialActive = getActiveVehicle();
      log(`Initial garage count: ${initialGarage.vehicles.length}`);
      log(`Initial active: ${initialActive ? `${initialActive.year} ${initialActive.make} ${initialActive.model}` : 'none'}`);
      log('');

      // Step 1: Navigate to Vehicle A tire search
      log('=== Step 1: Navigate to Vehicle A (2024 Ford F-150) ===');
      const urlA = '/tires?year=2024&make=Ford&model=F-150&trim=XLT';
      log(`Navigating to: ${urlA}`);
      
      // We'll redirect and the page will handle adding to garage
      window.location.href = urlA;
    }

    // Check if we're on a test step and continue
    function checkTestContinuation() {
      const url = new URL(window.location.href);
      const step = url.searchParams.get('testStep');
      
      if (step === '2') {
        // Came from Vehicle A, now check and go to Vehicle B
        setTimeout(() => {
          clearLog();
          log('=== Step 2: Check Vehicle A was added, navigate to Vehicle B ===');
          
          const garage = getGarage();
          const active = getActiveVehicle();
          
          log(`Garage count: ${garage.vehicles.length}`);
          const hasF150 = garage.vehicles.some(v => v.make === 'Ford' && v.model === 'F-150');
          log(`F-150 in garage: ${hasF150}`, hasF150);
          log(`Active vehicle: ${active ? `${active.year} ${active.make} ${active.model}` : 'none'}`);
          
          if (active && active.make === 'Ford') {
            log('Vehicle A is active!', true);
          } else {
            log('Vehicle A should be active', false);
          }
          
          log('');
          log('Now navigating to Vehicle B (2022 Toyota Camry)...');
          
          setTimeout(() => {
            window.location.href = '/tires?year=2022&make=Toyota&model=Camry&trim=SE&testStep=3';
          }, 2000);
        }, 2000);
      }
      
      if (step === '3') {
        // Came from Vehicle B, check both are in garage
        setTimeout(() => {
          clearLog();
          log('=== Step 3: Final Verification ===');
          
          const garage = getGarage();
          const active = getActiveVehicle();
          
          log(`Garage count: ${garage.vehicles.length}`);
          log(`Expected: 2 vehicles`, garage.vehicles.length === 2);
          
          const hasF150 = garage.vehicles.some(v => v.make === 'Ford' && v.model === 'F-150');
          const hasCamry = garage.vehicles.some(v => v.make === 'Toyota' && v.model === 'Camry');
          
          log(`F-150 in garage: ${hasF150}`, hasF150);
          log(`Camry in garage: ${hasCamry}`, hasCamry);
          
          log(`Active vehicle: ${active ? `${active.year} ${active.make} ${active.model}` : 'none'}`);
          if (active && active.make === 'Toyota') {
            log('Vehicle B (Camry) is now active!', true);
          } else {
            log('Vehicle B should be active', false);
          }
          
          log('');
          log('=== Duplicate Test: Navigate to same URL again ===');
          setTimeout(() => {
            window.location.href = '/tires?year=2022&make=Toyota&model=Camry&trim=SE&testStep=4';
          }, 2000);
        }, 2000);
      }
      
      if (step === '4') {
        // Check no duplicate was created
        setTimeout(() => {
          clearLog();
          log('=== Step 4: Duplicate Prevention Check ===');
          
          const garage = getGarage();
          log(`Garage count: ${garage.vehicles.length}`);
          log(`Expected: Still 2 vehicles (no duplicate)`, garage.vehicles.length === 2);
          
          const camryCount = garage.vehicles.filter(v => v.make === 'Toyota' && v.model === 'Camry').length;
          log(`Camry instances: ${camryCount}`, camryCount === 1);
          
          log('');
          log('=== Step 5: Refresh Persistence ===');
          log('Refreshing page to test persistence...');
          
          setTimeout(() => {
            window.location.href = '/garage-test.html?testStep=5';
          }, 2000);
        }, 2000);
      }
      
      if (step === '5') {
        // Check persistence after refresh
        setTimeout(() => {
          clearLog();
          log('=== Step 5: Persistence After Refresh ===');
          
          const garage = getGarage();
          const active = getActiveVehicle();
          
          log(`Garage count after refresh: ${garage.vehicles.length}`);
          log(`Expected: 2 vehicles persisted`, garage.vehicles.length === 2);
          
          log(`Active after refresh: ${active ? `${active.year} ${active.make} ${active.model}` : 'none'}`);
          if (active && active.make === 'Toyota') {
            log('Active vehicle persisted correctly!', true);
          } else {
            log('Active should persist as Toyota Camry', false);
          }
          
          log('');
          log('=== All Tests Complete ===');
          
          // Summary
          const hasF150 = garage.vehicles.some(v => v.make === 'Ford' && v.model === 'F-150');
          const hasCamry = garage.vehicles.some(v => v.make === 'Toyota' && v.model === 'Camry');
          
          const allPass = garage.vehicles.length === 2 && hasF150 && hasCamry && active?.make === 'Toyota';
          
          log('');
          log(allPass ? '🎉 ALL TESTS PASSED!' : '⚠️ Some tests failed', allPass);
          
        }, 1000);
      }
    }
    
    // Run continuation check on load
    checkTestContinuation();
  </script>
</body>
</html>
