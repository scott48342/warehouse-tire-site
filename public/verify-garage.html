<!DOCTYPE html>
<html>
<head>
  <title>Garage Verification Test</title>
  <style>
    body { font-family: system-ui; padding: 20px; max-width: 900px; margin: 0 auto; }
    .pass { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }
    .test { margin: 8px 0; padding: 12px; background: #f5f5f5; border-radius: 4px; }
    button { padding: 12px 24px; font-size: 16px; cursor: pointer; margin: 8px; background: #333; color: white; border: none; border-radius: 6px; }
    button:hover { background: #555; }
    .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
    h2 { margin-top: 0; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
    pre { background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 4px; overflow: auto; font-size: 13px; }
    .status { font-size: 18px; padding: 15px; text-align: center; border-radius: 8px; margin: 20px 0; }
    .status.success { background: #d4edda; color: #155724; }
    .status.failure { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>🚗 Garage URL Flow Verification</h1>
  
  <div class="section">
    <h2>Test Controls</h2>
    <button onclick="clearAndStart()">1. Clear Storage & Start Test</button>
    <button onclick="checkState()">Check Current State</button>
  </div>
  
  <div id="output"></div>
  <div id="status"></div>

  <script>
    const GARAGE_KEY = 'wt_garage';
    const ACTIVE_KEY = 'wt_garage_active_id';
    const results = [];
    
    function log(msg, isPass = null) {
      const div = document.createElement('div');
      div.className = 'test ' + (isPass === true ? 'pass' : isPass === false ? 'fail' : '');
      const icon = isPass === true ? '✅' : isPass === false ? '❌' : '📋';
      div.innerHTML = `${icon} ${msg}`;
      document.getElementById('output').appendChild(div);
      if (isPass !== null) results.push(isPass);
    }
    
    function clear() {
      document.getElementById('output').innerHTML = '';
      document.getElementById('status').innerHTML = '';
      results.length = 0;
    }
    
    function showSummary() {
      const passed = results.filter(r => r).length;
      const total = results.length;
      const allPass = passed === total;
      const status = document.getElementById('status');
      status.className = 'status ' + (allPass ? 'success' : 'failure');
      status.innerHTML = allPass 
        ? `🎉 All ${total} tests passed!`
        : `⚠️ ${passed}/${total} tests passed`;
    }

    function getGarage() {
      try {
        return JSON.parse(localStorage.getItem(GARAGE_KEY) || '{"vehicles":[]}');
      } catch { return { vehicles: [] }; }
    }

    function getActiveId() {
      try {
        return JSON.parse(localStorage.getItem(ACTIVE_KEY) || 'null');
      } catch { return null; }
    }

    function getActiveVehicle() {
      const id = getActiveId();
      if (!id) return null;
      const garage = getGarage();
      return garage.vehicles.find(v => v.id === id) || null;
    }

    function clearAndStart() {
      localStorage.clear();
      clear();
      log('Storage cleared. Redirecting to Vehicle A (2024 Ford F-150)...');
      setTimeout(() => {
        window.location.href = '/tires?year=2024&make=Ford&model=F-150&trim=XLT&testPhase=1';
      }, 1000);
    }

    function checkState() {
      clear();
      log('<strong>Current localStorage State</strong>');
      
      const garage = getGarage();
      const activeId = getActiveId();
      const active = getActiveVehicle();
      
      log(`Garage vehicles: ${garage.vehicles.length}`);
      garage.vehicles.forEach((v, i) => {
        log(`  [${i}] ${v.year} ${v.make} ${v.model} ${v.trim || ''} (id: ${v.id?.slice(0,10)}...)`);
      });
      
      log(`Active ID: ${activeId || 'none'}`);
      log(`Active Vehicle: ${active ? `${active.year} ${active.make} ${active.model}` : 'none'}`);
      
      log('');
      log('<pre>' + JSON.stringify({garage, activeId}, null, 2) + '</pre>');
    }

    // Check URL params for test phases
    function runTestPhase() {
      const params = new URLSearchParams(window.location.search);
      const phase = params.get('testPhase');
      
      if (phase === '1') {
        // Just arrived from Vehicle A URL, now check and go to Vehicle B
        setTimeout(() => {
          clear();
          log('<strong>Phase 1: After Vehicle A URL Navigation</strong>');
          
          const garage = getGarage();
          const active = getActiveVehicle();
          
          const hasF150 = garage.vehicles.some(v => v.make === 'Ford' && v.model === 'F-150');
          log(`F-150 added to garage: ${hasF150}`, hasF150);
          log(`F-150 is active: ${active?.model === 'F-150'}`, active?.model === 'F-150');
          log(`Garage count: ${garage.vehicles.length}`, garage.vehicles.length >= 1);
          
          log('');
          log('Navigating to Vehicle B (2022 Toyota Camry)...');
          
          setTimeout(() => {
            window.location.href = '/tires?year=2022&make=Toyota&model=Camry&trim=SE&testPhase=2';
          }, 2000);
        }, 2000);
      }
      
      if (phase === '2') {
        // After Vehicle B navigation
        setTimeout(() => {
          clear();
          log('<strong>Phase 2: After Vehicle B URL Navigation</strong>');
          
          const garage = getGarage();
          const active = getActiveVehicle();
          
          const hasF150 = garage.vehicles.some(v => v.make === 'Ford' && v.model === 'F-150');
          const hasCamry = garage.vehicles.some(v => v.make === 'Toyota' && v.model === 'Camry');
          
          log(`Both vehicles in garage: ${hasF150 && hasCamry}`, hasF150 && hasCamry);
          log(`Camry is now active: ${active?.model === 'Camry'}`, active?.model === 'Camry');
          log(`Garage count is 2: ${garage.vehicles.length === 2}`, garage.vehicles.length === 2);
          
          log('');
          log('Testing duplicate prevention - navigating to Camry URL again...');
          
          setTimeout(() => {
            window.location.href = '/tires?year=2022&make=Toyota&model=Camry&trim=SE&testPhase=3';
          }, 2000);
        }, 2000);
      }
      
      if (phase === '3') {
        // After duplicate test
        setTimeout(() => {
          clear();
          log('<strong>Phase 3: Duplicate Prevention Test</strong>');
          
          const garage = getGarage();
          const camryCount = garage.vehicles.filter(v => v.model === 'Camry').length;
          
          log(`No duplicate created: ${garage.vehicles.length === 2}`, garage.vehicles.length === 2);
          log(`Only one Camry: ${camryCount === 1}`, camryCount === 1);
          
          log('');
          log('Testing refresh persistence...');
          
          setTimeout(() => {
            window.location.href = '/verify-garage.html?testPhase=4';
          }, 2000);
        }, 2000);
      }
      
      if (phase === '4') {
        // After refresh
        setTimeout(() => {
          clear();
          log('<strong>Phase 4: Persistence After Refresh</strong>');
          
          const garage = getGarage();
          const active = getActiveVehicle();
          
          const hasF150 = garage.vehicles.some(v => v.make === 'Ford' && v.model === 'F-150');
          const hasCamry = garage.vehicles.some(v => v.make === 'Toyota' && v.model === 'Camry');
          
          log(`Both vehicles persisted: ${hasF150 && hasCamry}`, hasF150 && hasCamry);
          log(`Garage count still 2: ${garage.vehicles.length === 2}`, garage.vehicles.length === 2);
          log(`Active persisted (Camry): ${active?.model === 'Camry'}`, active?.model === 'Camry');
          
          log('');
          log('Testing vehicle switch - navigating back to F-150...');
          
          setTimeout(() => {
            window.location.href = '/tires?year=2024&make=Ford&model=F-150&trim=XLT&testPhase=5';
          }, 2000);
        }, 1500);
      }
      
      if (phase === '5') {
        // After switch back
        setTimeout(() => {
          clear();
          log('<strong>Phase 5: Vehicle Switch Test</strong>');
          
          const garage = getGarage();
          const active = getActiveVehicle();
          
          log(`F-150 is now active: ${active?.model === 'F-150'}`, active?.model === 'F-150');
          log(`Garage still has 2 vehicles: ${garage.vehicles.length === 2}`, garage.vehicles.length === 2);
          
          log('');
          log('<strong>===== FINAL SUMMARY =====</strong>');
          
          const hasF150 = garage.vehicles.some(v => v.make === 'Ford' && v.model === 'F-150');
          const hasCamry = garage.vehicles.some(v => v.make === 'Toyota' && v.model === 'Camry');
          
          showSummary();
          
          log('');
          log('Final state:');
          log('<pre>' + JSON.stringify(garage, null, 2) + '</pre>');
          
        }, 2000);
      }
    }
    
    // Run phase check on load
    runTestPhase();
  </script>
</body>
</html>
